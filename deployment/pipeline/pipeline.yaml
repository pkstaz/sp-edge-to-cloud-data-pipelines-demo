        # TensorFlow/XLA en GPU: sin esto a veces falla "libdevice.10.bc not found" (ruta nvvm).
        - name: TF_XLA_FLAGS
          value: "--tf_xla_auto_jit=0"
        - name: XLA_FLAGS
          value: "--xla_gpu_cuda_data_dir=/usr/local/cuda/nvvm/libdevice"
        image: quay.io/opendatahub-contrib/workbench-images:cuda-runtime-tensorflow-c9s-py39_2023c_latest
        computeResources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        volumeMounts:
        - mountPath: /data
          name: pipeline-pvc
          readOnly: false
      params:
      - name: working_dir
        type: string
      stepTemplate:
        volumeMounts:
        - name: mlpipeline-metrics
