apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: train-model
  namespace: tf
spec:
  # Tolerancia nvidia.com/gpu para TaskRuns que piden GPU; por defecto use_gpu_for_training=false (rama CPU).
  taskRunTemplate:
    podTemplate:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  params:
  - name: s3bucket_data
    type: string
    default: edge1-data
  - name: s3bucket_models
    type: string
    default: edge1-models
  - name: s3bucket_ready
    type: string
    default: edge1-ready
  - name: s3endpoint
    type: string
    default: http://minio-service.central.svc:9000
  - name: working_dir
    type: string
    default: /data/edge1/
  - name: use_gpu_for_training
    type: string
    default: "false"
    description: >
      Por defecto CPU (sin nvidia.com/gpu). Pon true/1/yes para create_model y push_model con GPU
      (requiere nodos NVIDIA y taint nvidia.com/gpu).
  tasks:
  - name: run-a-file
    params:
    - name: s3bucket_data
      value: $(params.s3bucket_data)
    - name: s3endpoint
      value: $(params.s3endpoint)
    - name: working_dir
      value: $(params.working_dir)
    taskSpec:
      steps:
      - name: main
        args:
        - |
          s3endpoint="$0"
          s3bucket_data="$1"
          working_dir="$2"
          sh -c "mkdir -p ./jupyter-work-dir && cd ./jupyter-work-dir"
          sh -c "echo 'Downloading file:///opt/app-root/bin/utils/bootstrapper.py' && curl --fail -H 'Cache-Control: no-cache' -L file:///opt/app-root/bin/utils/bootstrapper.py --output bootstrapper.py"
          sh -c "echo 'Downloading file:///opt/app-root/bin/utils/requirements-elyra.txt' && curl --fail -H 'Cache-Control: no-cache' -L file:///opt/app-root/bin/utils/requirements-elyra.txt --output requirements-elyra.txt"
          sh -c "python3 -m pip install packaging lxml_html_clean && python3 -m pip freeze > requirements-current.txt && python3 bootstrapper.py --pipeline-name 'retrain' --cos-endpoint 'http://minio-service.central.svc:9000' --cos-bucket 'workbench' --cos-directory 'retrain-0109181508' --cos-dependencies-archive 'step-01-6764011e-55f5-4d4d-a8c2-252b1de09bc8.tar.gz' --file 'step-01.ipynb' --pipeline-parameters 's3endpoint=$s3endpoint;s3bucket_data=$s3bucket_data;working_dir=$working_dir' --parameter-pass-method 'env' "
        - $(params.s3endpoint)
        - $(params.s3bucket_data)
        - $(params.working_dir)
        command:
        - sh
        - -c
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AWS_ACCESS_KEY_ID
              name: dc1
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: AWS_SECRET_ACCESS_KEY
              name: dc1
        - name: ELYRA_RUNTIME_ENV
          value: kfp
        - name: ELYRA_ENABLE_PIPELINE_INFO
          value: "True"
        - name: ELYRA_WRITABLE_CONTAINER_DIR
          value: /tmp
        - name: ELYRA_RUN_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelines.kubeflow.org/run_name']
        image: quay.io/opendatahub-contrib/workbench-images:cuda-runtime-tensorflow-c9s-py39_2023c_latest
        volumeMounts:
        - mountPath: /data
          name: pipeline-pvc
          readOnly: false
      params:
      - name: s3bucket_data
        type: string
      - name: s3endpoint
        type: string
      - name: working_dir
        type: string
      stepTemplate:
        volumeMounts:
        - name: mlpipeline-metrics
          mountPath: /tmp
      volumes:
      - name: mlpipeline-metrics
        emptyDir: {}
      - name: pipeline-pvc
        persistentVolumeClaim:
          claimName: pipeline-pvc
      metadata:
        labels:
          elyra/node-type: notebook-script
          elyra/pipeline-name: retrain
          elyra/pipeline-version: ''
          elyra/experiment-name: ''
          elyra/node-name: load_data
          pipelines.kubeflow.org/cache_enabled: "true"
        annotations:
          elyra/node-file-name: step-01.ipynb
          elyra/pipeline-source: retrain.pipeline
          pipelines.kubeflow.org/task_display_name: load_data
          pipelines.kubeflow.org/component_spec_digest: '{"name": "Run a file",
            "outputs": [], "version": "Run a file@sha256=d8d27dbe6138eb0cd0bd6d05f506fc069d4c0c8a22cff5ec4e8667d85eb7687b"}'
  - name: run-a-file-2
    when:
    - input: $(params.use_gpu_for_training)
      operator: in
      values: ["true", "1", "yes", "True"]
    params:
    - name: working_dir
      value: $(params.working_dir)
    taskSpec:
      steps:
      - name: main
        args:
        - |
          working_dir="$0"
          sh -c "mkdir -p ./jupyter-work-dir && cd ./jupyter-work-dir"
          sh -c "echo 'Downloading file:///opt/app-root/bin/utils/bootstrapper.py' && curl --fail -H 'Cache-Control: no-cache' -L file:///opt/app-root/bin/utils/bootstrapper.py --output bootstrapper.py"
          sh -c "echo 'Downloading file:///opt/app-root/bin/utils/requirements-elyra.txt' && curl --fail -H 'Cache-Control: no-cache' -L file:///opt/app-root/bin/utils/requirements-elyra.txt --output requirements-elyra.txt"
          sh -c "python3 -m pip install packaging lxml_html_clean && python3 -m pip freeze > requirements-current.txt && python3 bootstrapper.py --pipeline-name 'retrain' --cos-endpoint 'http://minio-service.central.svc:9000' --cos-bucket 'workbench' --cos-directory 'retrain-0109181508' --cos-dependencies-archive 'step-02-8af3247b-bc48-42f1-9f25-95e1de81169a.tar.gz' --file 'step-02.ipynb' --pipeline-parameters 'working_dir=$working_dir' --parameter-pass-method 'env' "
        - $(params.working_dir)
        command:
        - sh
        - -c
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AWS_ACCESS_KEY_ID
              name: dc1
        - name: AWS_SECRET_ACCESS_KEY
