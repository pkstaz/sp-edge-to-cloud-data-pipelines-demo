# Camel XML routes (incluidas en imagen nativa)
camel.main.source-location-enabled=true
quarkus.native.resources.includes=camel/stream.xml
# Mandrel en contenedor: motor por defecto podman (./mvnw -Dnative -Dquarkus.native.container-build=true)
quarkus.native.container-runtime=podman
camel.main.routes-include-pattern=camel/stream.xml

# Sin servlet: las rutas S3/MQTT no exponen HTTP pesado; se quita camel-quarkus-servlet (deprecado / innecesario aquí).
camel.main.streamCachingEnabled=false

# Límite HTTP razonable por si se añaden endpoints REST (health, etc.)
quarkus.http.limits.max-body-size=50M

# Bucket origen en central: {edge.id}-ready (p. ej. edge1-ready). En K8s/OpenShift usar fieldRef → EDGE_ID.
edge.id=${EDGE_ID:edge1}
%dev.edge.id=edge1

# --- S3: dos endpoints (central Skupper vs MinIO local). Sin credenciales en el componente global;
# cada URI repite el bloque de cliente (Quarkus interpola ${s3.common.client.params}).
# Mismo usuario en ambos MinIO del demo: minio / minio123
s3.common.client.params=accessKey=minio&secretKey=minio123&region=us-east-2&useDefaultCredentialsProvider=false&forcePathStyle=true&useSessionCredentials=false

# Consumer: bucket *-ready en central vía Skupper
camel.uri.s3.central.parameters=${s3.common.client.params}&uriEndpointOverride=http://minio-central.edge1.svc:9000&overrideEndpoint=true

# Desarrollo local: rutas HTTPS (oc get route …)
%dev.camel.uri.s3.central.parameters=${s3.common.client.params}&uriEndpointOverride=https://REPLACE_MINIO_API_ROUTE_CENTRAL&overrideEndpoint=true

# Producer: bucket production en MinIO del mismo namespace
camel.uri.s3.parameters=${s3.common.client.params}&uriEndpointOverride=http://minio-service:9000&overrideEndpoint=true

%dev.camel.uri.s3.parameters=${s3.common.client.params}&uriEndpointOverride=https://REPLACE_MINIO_API_ROUTE_EDGE1&overrideEndpoint=true

# MQTT (nombre de servicio del operador AMQ en edge1)
mqtt.uri.monitor=paho-mqtt5:monitor?brokerUrl=tcp://broker-amq-mqtt-0-svc:1883
%dev.mqtt.uri.monitor=paho-mqtt5:monitor?brokerUrl=tcp://127.0.0.1:1883
